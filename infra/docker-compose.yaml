# Subir o stack (app + db) => docker compose --profile stack up -d --build
# Subir só o postgres (para usar a IDE local) => docker compose --profile ide up -d

services:
  postgres:
    networks: [app_net]
    image: postgres:17
    container_name: pg-restaurant
    restart: unless-stopped
    profiles: ["ide", "stack"]
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_NAME:-restaurant_backend_db}"
      POSTGRES_USER: "${DB_USER:-restaurant_backend_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-restaurant_backend_password}"
      TZ: "${TZ:-America/Sao_Paulo}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-restaurant_backend_user} -d ${DB_NAME:-restaurant_backend_db}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    networks: [app_net]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: restaurant-api:latest
    container_name: restaurant-api
    restart: unless-stopped
    profiles: ["stack"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Definir na .env: SPRING_PROFILES_ACTIVE=dev, prod ou test
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      # Datasource container-para-container (DNS 'postgres' na rede do Compose)
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${DB_NAME:-restaurant_backend_db}"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-restaurant_backend_user}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-restaurant_backend_password}"
      JWT_SECURITY_TOKEN: "${JWT_SECURITY_TOKEN:-dev-placeholder}"
      JWT_EXPIRATION: "${JWT_EXPIRATION:-3600}"
      # Flags JVM e timezone
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC"
      TZ: "${TZ:-America/Sao_Paulo}"
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data: { }

networks:
  app_net:
    driver: bridge
