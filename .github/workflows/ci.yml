# This workflow builds a Java project with Maven, runs tests, generates coverage reports,
# uploads to Codecov, captures a JaCoCo HTML screenshot, and commits it to the repo (main only).
name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Permite que o GITHUB_TOKEN faça push no repositório
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package --file pom.xml

      - name: Run Tests and Generate Coverage Report
        run: mvn verify jacoco:report --file pom.xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          verbose: true
          fail_ci_if_error: true

      - name: Set up Node.js (for screenshot)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Images Directory
        run: mkdir -p docs/images

      # (Opcional, mas ajuda quando Puppeteer falha por libs no Ubuntu)
      - name: Install Chromium dependencies (optional)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxkbcommon0 \
            libxcomposite1 libxrandr2 libxdamage1 libgbm1 libpango-1.0-0 \
            libpangocairo-1.0-0 libasound2t64 || true

      - name: Capture JaCoCo Report Screenshot
        run: |
          npm init -y
          npm install puppeteer --save-dev
          node -e "const puppeteer = require('puppeteer'); (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1920, height: 1080 });
            await page.goto('file://${{ github.workspace }}/target/site/jacoco/index.html', { waitUntil: 'networkidle0' });
            await page.screenshot({ path: 'docs/images/jacoco-coverage.png', fullPage: true });
            await browser.close();
          })();"

      - name: Commit and Push Screenshot (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/images/jacoco-coverage.png

          git commit -m "Update JaCoCo coverage screenshot [skip ci]" || echo "No changes to commit"

          git push

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-screenshot
          path: docs/images/jacoco-coverage.png
